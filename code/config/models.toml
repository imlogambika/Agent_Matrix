# Open-source models used by the agent, run locally with llama.cpp (llama-server).
# Weights are 4-bit GGUF files fetched from Hugging Face on first use and cached in
# ~/.cache/huggingface. No API key and no paid service is involved.
#
# `selected` is the configuration chosen by code/evaluation/model_benchmark.py
# (see code/evaluation/model_benchmark.md for the scores behind the choice).

[runtime]
# path to llama-server; overridden by the LLAMA_SERVER environment variable
binary = "~/.local/opt/llama.cpp-b11669/llama-b11669/llama-server"
# where GGUF files are stored (GHOST_MODELS_DIR overrides); the HF cache is also searched
models_dir = "~/.local/opt/ghost-models"
threads = 8
ctx_size = 8192
image_max_tokens = 1536      # caps the vision tokens per screenshot (CPU time grows with it)
port = 8079
request_timeout_s = 900      # per model call; failures are retried once, then the run degrades to rules

[selected]
intent = ["llama-3.2-3b", "qwen2.5-vl-3b"]
extraction = "qwen2.5-vl-3b"
# transcribe = the vision model reads the screen, a fixed parser structures it (PDFs need no model);
# json = the model fills the record schema directly
extraction_mode = "transcribe"

[models."qwen2.5-vl-3b"]
display = "Qwen2.5-VL-3B-Instruct"
vendor = "Alibaba Qwen"
license = "qwen-research"
params_b = 3.8
repo = "ggml-org/Qwen2.5-VL-3B-Instruct-GGUF"
file = "Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf"
mmproj = "mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf"

[models."gemma-3-4b"]
display = "Gemma-3-4B-it"
vendor = "Google"
license = "gemma"
params_b = 4.3
repo = "ggml-org/gemma-3-4b-it-GGUF"
file = "gemma-3-4b-it-Q4_K_M.gguf"
mmproj = "mmproj-model-f16.gguf"
# Gemma 3 uses sliding-window attention; a full-size SWA cache lets llama.cpp reuse the shared
# prompt prefix between requests (otherwise every request re-reads the whole prompt: ~12x slower)
server_args = ["--swa-full"]

[models."smolvlm2-2.2b"]
display = "SmolVLM2-2.2B-Instruct"
vendor = "Hugging Face"
license = "apache-2.0"
params_b = 2.2
repo = "ggml-org/SmolVLM2-2.2B-Instruct-GGUF"
file = "SmolVLM2-2.2B-Instruct-Q4_K_M.gguf"
mmproj = "mmproj-SmolVLM2-2.2B-Instruct-Q8_0.gguf"

[models."qwen2.5-1.5b"]
display = "Qwen2.5-1.5B-Instruct"
vendor = "Alibaba Qwen"
license = "apache-2.0"
params_b = 1.5
repo = "Qwen/Qwen2.5-1.5B-Instruct-GGUF"
file = "qwen2.5-1.5b-instruct-q4_k_m.gguf"

[models."llama-3.2-3b"]
display = "Llama-3.2-3B-Instruct"
vendor = "Meta"
license = "llama3.2"
params_b = 3.2
repo = "bartowski/Llama-3.2-3B-Instruct-GGUF"
file = "Llama-3.2-3B-Instruct-Q4_K_M.gguf"
